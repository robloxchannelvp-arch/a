<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Agenda - Google Calendar Vibe</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Config for Dark Mode support -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col antialiased transition-colors duration-200 selection:bg-brand-500 selection:text-white">

  <!-- TOP NAVBAR -->
  <header class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 px-4 flex items-center justify-between shrink-0 shadow-sm z-20">
    <div class="flex items-center space-x-3 sm:space-x-6">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
          <i class="fa-regular font-bold text-xl fa-calendar-days"></i>
        </div>
        <span class="font-bold text-lg sm:text-xl tracking-tight hidden xs:inline-block">Agenda<span class="text-brand-600 dark:text-brand-500">Pro</span></span>
      </div>

      <button id="btn-today" class="px-3.5 py-1.5 text-sm font-medium border border-slate-300 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        Today
      </button>

      <div class="flex items-center space-x-1">
        <button id="btn-prev" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button id="btn-next" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <h2 id="current-month-display" class="text-base sm:text-xl font-bold min-w-[140px]"></h2>
    </div>

    <!-- Right Navbar Tools -->
    <div class="flex items-center space-x-2 sm:space-x-4">
      <!-- Search Input -->
      <div class="relative hidden md:block w-48 lg:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
        <input type="text" id="search-input" placeholder="Search events..." class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-100 dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
      </div>

      <!-- View Selector -->
      <div class="bg-slate-100 dark:bg-slate-800 p-1 rounded-lg flex text-xs sm:text-sm font-medium">
        <button data-view="month" class="view-btn px-2.5 py-1 rounded-md transition active-view">Month</button>
        <button data-view="week" class="view-btn px-2.5 py-1 rounded-md transition">Week</button>
        <button data-view="day" class="view-btn px-2.5 py-1 rounded-md transition">Day</button>
      </div>

      <!-- Dark Mode Toggle -->
      <button id="btn-theme-toggle" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
      </button>

      <!-- Quick Create Button -->
      <button id="btn-open-create-modal" class="hidden sm:flex items-center space-x-2 bg-brand-600 hover:bg-brand-700 text-white font-medium px-3.5 py-1.5 rounded-lg text-sm shadow-md shadow-brand-600/30 transition">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>Create</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <div class="flex-1 flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 p-4 flex flex-col justify-between hidden md:flex shrink-0">
      <div class="space-y-6">
        <!-- Mini Calendar / Shortcut -->
        <button id="btn-create-side" class="w-full flex items-center justify-center space-x-2 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-xl text-sm shadow-lg shadow-brand-600/20 transition transform active:scale-95">
          <i class="fa-solid fa-plus"></i>
          <span>New Event</span>
        </button>

        <!-- Category Filters -->
        <div>
          <h3 class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3">Filter by Category</h3>
          <div id="category-filters" class="space-y-1.5">
            <!-- Filter checkboxes loaded dynamically -->
          </div>
        </div>
      </div>

      <!-- Sidebar Footer / Quick Stats -->
      <div class="pt-4 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-400">
        <div class="flex justify-between items-center mb-1">
          <span>Total Events:</span>
          <span id="total-events-count" class="font-bold text-slate-700 dark:text-slate-300">0</span>
        </div>
      </div>
    </aside>

    <!-- CALENDAR CONTAINER -->
    <main class="flex-1 flex flex-col relative overflow-hidden bg-white dark:bg-slate-900">
      
      <!-- MONTH VIEW -->
      <div id="view-month" class="calendar-view flex-1 flex flex-col h-full">
        <div class="grid grid-cols-7 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/50 text-xs font-semibold text-slate-500 uppercase py-2 text-center shrink-0">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="month-grid" class="flex-1 grid grid-cols-7 grid-rows-6 border-slate-200 dark:border-slate-800 overflow-y-auto">
          <!-- Calendar Days Generated JS -->
        </div>
      </div>

      <!-- WEEK VIEW -->
      <div id="view-week" class="calendar-view flex-1 hidden flex-col h-full overflow-y-auto">
        <div id="week-header" class="grid grid-cols-8 border-b border-slate-200 dark:border-slate-800 sticky top-0 bg-white dark:bg-slate-900 z-10 text-center py-2 text-xs font-semibold text-slate-500">
          <!-- JS fills time label + 7 days -->
        </div>
        <div id="week-grid" class="grid grid-cols-8 flex-1 min-h-[700px]">
          <!-- JS fills hours and slots -->
        </div>
      </div>

      <!-- DAY VIEW -->
      <div id="view-day" class="calendar-view flex-1 hidden flex-col h-full overflow-y-auto">
        <div id="day-header" class="border-b border-slate-200 dark:border-slate-800 sticky top-0 bg-white dark:bg-slate-900 z-10 p-3 text-center font-bold text-lg">
          <!-- JS fills selected day title -->
        </div>
        <div id="day-grid" class="flex-1 p-4 max-w-3xl mx-auto w-full">
          <!-- JS fills day detailed schedule -->
        </div>
      </div>

    </main>
  </div>

  <!-- FLOATING ACTION BUTTON (Mobile Only) -->
  <button id="btn-fab" class="sm:hidden fixed right-5 bottom-5 w-14 h-14 bg-brand-600 text-white rounded-full flex items-center justify-center shadow-xl text-xl z-30 active:scale-90 transition">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- EVENT MODAL (Create/Edit) -->
  <div id="event-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 opacity-0 transition-opacity duration-200">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/30">
        <h3 id="modal-title" class="font-bold text-lg text-slate-800 dark:text-slate-100">Add New Event</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Modal Body Form -->
      <form id="event-form" class="p-6 space-y-4">
        <input type="hidden" id="event-id">

        <!-- Title -->
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Title</label>
          <input type="text" id="event-title" required placeholder="Event title..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">
        </div>

        <!-- Date & Time Grid -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Date</label>
            <input type="date" id="event-date" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Time</label>
            <input type="time" id="event-time" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">
          </div>
        </div>

        <!-- Tag & Color selection -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Category / Tag</label>
            <select id="event-category" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm">
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Important">Important</option>
              <option value="Meeting">Meeting</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Color Palette</label>
            <div class="flex items-center space-x-2 pt-1" id="color-picker-container">
              <!-- Preset Colors dynamic selection -->
            </div>
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Description</label>
          <textarea id="event-description" rows="3" placeholder="Add details or notes..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none text-sm resize-none"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex justify-between items-center pt-2">
          <button type="button" id="btn-delete-event" class="hidden text-rose-600 hover:text-rose-700 dark:hover:text-rose-400 text-sm font-medium items-center space-x-1">
            <i class="fa-solid fa-trash"></i>
            <span>Delete</span>
          </button>
          <div class="flex space-x-2 ml-auto">
            <button type="button" id="btn-cancel-modal" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm font-medium bg-brand-600 hover:bg-brand-700 text-white rounded-lg shadow-md transition">Save Event</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- APPLICATION LOGIC (JavaScript) -->
  <script>
    // --- APP STATE ---
    const STATE = {
      currentDate: new Date(),
      selectedDate: new Date(),
      view: 'month', // 'month' | 'week' | 'day'
      events: [],
      filterCategories: new Set(['Work', 'Personal', 'Important', 'Meeting']),
      searchQuery: '',
      selectedColor: '#6366f1' // default indigo
    };

    const PRESET_COLORS = [
      '#6366f1', // Indigo
      '#ec4899', // Pink
      '#10b981', // Emerald
      '#f59e0b', // Amber
      '#3b82f6', // Blue
      '#8b5cf6'  // Purple
    ];

    const CATEGORY_COLORS = {
      'Work': '#3b82f6',
      'Personal': '#10b981',
      'Important': '#ec4899',
      'Meeting': '#8b5cf6'
    };

    // --- LOCAL STORAGE HELPERS ---
    const STORAGE_KEY = 'custom_agenda_events_v1';
    
    function loadEvents() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          STATE.events = JSON.parse(stored);
        } catch (e) {
          console.error('Failed to parse local events:', e);
          STATE.events = getSeedEvents();
        }
      } else {
        STATE.events = getSeedEvents();
        saveEvents();
      }
    }

    function saveEvents() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE.events));
      updateTotalCount();
    }

    function getSeedEvents() {
      const today = new Date();
      const formatDay = (offset) => {
        const d = new Date(today);
        d.setDate(d.getDate() + offset);
        return d.toISOString().split('T')[0];
      };

      return [
        {
          id: '1',
          title: 'Project Kickoff Meeting',
          date: formatDay(0),
          time: '10:00',
          category: 'Work',
          color: '#3b82f6',
          description: 'Review product specs with design and dev team.'
        },
        {
          id: '2',
          title: 'Gym & Cardio Session',
          date: formatDay(0),
          time: '18:00',
          category: 'Personal',
          color: '#10b981',
          description: 'Leg day workout routine.'
        },
        {
          id: '3',
          title: 'Design Review Deadline',
          date: formatDay(2),
          time: '14:30',
          category: 'Important',
          color: '#ec4899',
          description: 'Submit updated Figma mockups.'
        }
      ];
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadEvents();
      setupColorPicker();
      setupCategoryFilters();
      setupEventListeners();
      render();
    });

    // --- THEME CONTROL ---
    function initTheme() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
    }

    // --- RENDER ROUTER ---
    function render() {
      updateHeaderTitle();
      
      // Filter events by Search & Sidebar categories
      const filteredEvents = STATE.events.filter(ev => {
        const matchesCategory = STATE.filterCategories.has(ev.category);
        const matchesSearch = ev.title.toLowerCase().includes(STATE.searchQuery.toLowerCase()) || 
                              (ev.description && ev.description.toLowerCase().includes(STATE.searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      if (STATE.view === 'month') {
        renderMonthView(filteredEvents);
      } else if (STATE.view === 'week') {
        renderWeekView(filteredEvents);
      } else if (STATE.view === 'day') {
        renderDayView(filteredEvents);
      }
    }

    function updateHeaderTitle() {
      const display = document.getElementById('current-month-display');
      const options = { month: 'long', year: 'numeric' };
      display.textContent = STATE.currentDate.toLocaleDateString('en-US', options);
    }

    function updateTotalCount() {
      document.getElementById('total-events-count').textContent = STATE.events.length;
    }

    // --- MONTH VIEW RENDERING ---
    function renderMonthView(events) {
      const grid = document.getElementById('month-grid');
      grid.innerHTML = '';

      const year = STATE.currentDate.getFullYear();
      const month = STATE.currentDate.getMonth();

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const todayStr = new Date().toISOString().split('T')[0];

      // Total slots 42 (6 rows x 7 cols)
      for (let i = 0; i < 42; i++) {
        const cell = document.createElement('div');
        cell.className = 'border-r border-b border-slate-200 dark:border-slate-800/60 min-h-[90px] sm:min-h-[110px] p-1 sm:p-1.5 flex flex-col transition hover:bg-slate-50/50 dark:hover:bg-slate-800/30';

        let dayNum, cellDateString, isCurrentMonth = true;

        if (i < firstDayOfMonth) {
          // Previous month padding
          dayNum = daysInPrevMonth - firstDayOfMonth + i + 1;
          const prevDate = new Date(year, month - 1, dayNum);
          cellDateString = formatDate(prevDate);
          isCurrentMonth = false;
        } else if (i >= firstDayOfMonth + daysInMonth) {
          // Next month padding
          dayNum = i - (firstDayOfMonth + daysInMonth) + 1;
          const nextDate = new Date(year, month + 1, dayNum);
          cellDateString = formatDate(nextDate);
          isCurrentMonth = false;
        } else {
          // Current month active days
          dayNum = i - firstDayOfMonth + 1;
          const currentDate = new Date(year, month, dayNum);
          cellDateString = formatDate(currentDate);
        }

        // Header for day number
        const isToday = cellDateString === todayStr;
        const dayHeader = document.createElement('div');
        dayHeader.className = `text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center mb-1 ${
          isToday 
            ? 'bg-brand-600 text-white' 
            : isCurrentMonth ? 'text-slate-700 dark:text-slate-300' : 'text-slate-300 dark:text-slate-700'
        }`;
        dayHeader.textContent = dayNum;
        cell.appendChild(dayHeader);

        // Filter events for this exact day
        const dayEvents = events.filter(e => e.date === cellDateString);
        
        // Container for events inside day cell
        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'space-y-1 overflow-y-auto flex-1';

        dayEvents.forEach(ev => {
          const badge = document.createElement('div');
          badge.className = 'text-[11px] leading-tight p-1 rounded font-medium text-white shadow-xs truncate cursor-pointer transition hover:opacity-90';
          badge.style.backgroundColor = ev.color || '#6366f1';
          badge.textContent = `${ev.time} ${ev.title}`;
          badge.onclick = (e) => {
            e.stopPropagation();
            openEditModal(ev);
          };
          eventsContainer.appendChild(badge);
        });

        cell.appendChild(eventsContainer);

        // Click cell to quickly create event on that date
        cell.onclick = () => {
          openCreateModal(cellDateString);
        };

        grid.appendChild(cell);
      }
    }

    // --- WEEK VIEW RENDERING ---
    function renderWeekView(events) {
      const header = document.getElementById('week-header');
      const grid = document.getElementById('week-grid');
      header.innerHTML = '<div class="p-2 border-r border-slate-200 dark:border-slate-800">Time</div>';
      grid.innerHTML = '';

      const startOfWeek = getStartOfWeek(STATE.currentDate);
      const weekDates = [];

      for (let i = 0; i < 7; i++) {
        const d = new Date(startOfWeek);
        d.setDate(d.getDate() + i);
        weekDates.push(d);

        const dateStr = formatDate(d);
        const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
        const dayNum = d.getDate();

        header.innerHTML += `
          <div class="p-2 border-r border-slate-200 dark:border-slate-800">
            <div>${dayName}</div>
            <div class="text-sm font-bold text-slate-800 dark:text-slate-200">${dayNum}</div>
          </div>
        `;
      }

      // Render hours column & days grid
      for (let hour = 8; hour <= 20; hour++) {
        const timeLabel = `${hour.toString().padStart(2, '0')}:00`;

        // Left column time
        const timeCell = document.createElement('div');
        timeCell.className = 'border-b border-r border-slate-200 dark:border-slate-800 p-1 text-[11px] text-slate-400 text-center select-none';
        timeCell.textContent = timeLabel;
        grid.appendChild(timeCell);

        // 7 day slots for this hour
        weekDates.forEach(d => {
          const cellDateStr = formatDate(d);
          const slot = document.createElement('div');
          slot.className = 'border-b border-r border-slate-200 dark:border-slate-800 p-1 relative min-h-[48px] hover:bg-slate-50 dark:hover:bg-slate-800/20 transition cursor-pointer';

          // Events in this hour slot
          const hourEvents = events.filter(e => {
            const evHour = parseInt(e.time.split(':')[0], 10);
            return e.date === cellDateStr && evHour === hour;
          });

          hourEvents.forEach(ev => {
            const evBadge = document.createElement('div');
            evBadge.className = 'text-xs p-1 rounded text-white font-medium truncate mb-1 shadow-xs cursor-pointer';
            evBadge.style.backgroundColor = ev.color;
            evBadge.textContent = `${ev.time} - ${ev.title}`;
            evBadge.onclick = (e) => {
              e.stopPropagation();
              openEditModal(ev);
            };
            slot.appendChild(evBadge);
          });

          slot.onclick = () => openCreateModal(cellDateStr, timeLabel);
          grid.appendChild(slot);
        });
      }
    }

    // --- DAY VIEW RENDERING ---
    function renderDayView(events) {
      const header = document.getElementById('day-header');
      const grid = document.getElementById('day-grid');
      
      const dateStr = formatDate(STATE.currentDate);
      header.textContent = STATE.currentDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      grid.innerHTML = '';
      const dayEvents = events.filter(e => e.date === dateStr);

      if (dayEvents.length === 0) {
        grid.innerHTML = `
          <div class="text-center py-16 text-slate-400">
            <i class="fa-regular fa-calendar-xmark text-4xl mb-3"></i>
            <p class="text-sm font-medium">No events scheduled for this day.</p>
            <button onclick="openCreateModal('${dateStr}')" class="mt-4 px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition">Add Event</button>
          </div>
        `;
        return;
      }

      // Sort chronologically
      dayEvents.sort((a, b) => a.time.localeCompare(b.time));

      dayEvents.forEach(ev => {
        const card = document.createElement('div');
        card.className = 'mb-3 p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 flex items-start space-x-4 shadow-sm hover:shadow-md transition cursor-pointer border-l-4';
        card.style.borderLeftColor = ev.color || '#6366f1';

        card.innerHTML = `
          <div class="text-sm font-bold text-slate-500 w-16 pt-0.5">${ev.time}</div>
          <div class="flex-1">
            <div class="flex items-center space-x-2">
              <h4 class="font-semibold text-slate-800 dark:text-slate-100 text-base">${escapeHtml(ev.title)}</h4>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">${ev.category}</span>
            </div>
            ${ev.description ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${escapeHtml(ev.description)}</p>` : ''}
          </div>
        `;

        card.onclick = () => openEditModal(ev);
        grid.appendChild(card);
      });
    }

    // --- MODAL & EVENT HANDLING ---
    const modal = document.getElementById('event-modal');
    const eventForm = document.getElementById('event-form');

    function openCreateModal(dateString = null, timeString = '09:00') {
      document.getElementById('modal-title').textContent = 'Add New Event';
      document.getElementById('event-id').value = '';
      document.getElementById('event-title').value = '';
      document.getElementById('event-date').value = dateString || formatDate(STATE.currentDate);
      document.getElementById('event-time').value = timeString;
      document.getElementById('event-category').value = 'Work';
      document.getElementById('event-description').value = '';
      document.getElementById('btn-delete-event').classList.add('hidden');

      selectColor(PRESET_COLORS[0]);
      showModal();
    }

    function openEditModal(event) {
      document.getElementById('modal-title').textContent = 'Edit Event';
      document.getElementById('event-id').value = event.id;
      document.getElementById('event-title').value = event.title;
      document.getElementById('event-date').value = event.date;
      document.getElementById('event-time').value = event.time;
      document.getElementById('event-category').value = event.category || 'Work';
      document.getElementById('event-description').value = event.description || '';
      document.getElementById('btn-delete-event').classList.remove('hidden');

      selectColor(event.color || PRESET_COLORS[0]);
      showModal();
    }

    function showModal() {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modal.querySelector('.transform').classList.remove('scale-95');
      }, 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      modal.querySelector('.transform').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    function setupColorPicker() {
      const container = document.getElementById('color-picker-container');
      container.innerHTML = '';
      PRESET_COLORS.forEach(color => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-6 h-6 rounded-full transition transform hover:scale-110 flex items-center justify-center color-opt';
        btn.style.backgroundColor = color;
        btn.dataset.color = color;
        btn.onclick = () => selectColor(color);
        container.appendChild(btn);
      });
    }

    function selectColor(color) {
      STATE.selectedColor = color;
      document.querySelectorAll('.color-opt').forEach(btn => {
        if (btn.dataset.color === color) {
          btn.innerHTML = '<i class="fa-solid fa-check text-[10px] text-white"></i>';
        } else {
          btn.innerHTML = '';
        }
      });
    }

    function setupCategoryFilters() {
      const container = document.getElementById('category-filters');
      container.innerHTML = '';

      Object.keys(CATEGORY_COLORS).forEach(cat => {
        const label = document.createElement('label');
        label.className = 'flex items-center space-x-2 text-sm text-slate-600 dark:text-slate-300 cursor-pointer select-none';
        label.innerHTML = `
          <input type="checkbox" checked value="${cat}" class="cat-filter rounded text-brand-600 focus:ring-brand-500">
          <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${CATEGORY_COLORS[cat]}"></span>
          <span>${cat}</span>
        `;
        container.appendChild(label);
      });

      document.querySelectorAll('.cat-filter').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            STATE.filterCategories.add(e.target.value);
          } else {
            STATE.filterCategories.delete(e.target.value);
          }
          render();
        });
      });
    }

    // --- EVENT LISTENERS ---
    function setupEventListeners() {
      // Theme toggle
      document.getElementById('btn-theme-toggle').onclick = toggleTheme;

      // Modal open/close
      document.getElementById('btn-open-create-modal').onclick = () => openCreateModal();
      document.getElementById('btn-create-side').onclick = () => openCreateModal();
      document.getElementById('btn-fab').onclick = () => openCreateModal();
      document.getElementById('btn-close-modal').onclick = closeModal;
      document.getElementById('btn-cancel-modal').onclick = closeModal;

      // Save/Submit Form
      eventForm.onsubmit = (e) => {
        e.preventDefault();
        const id = document.getElementById('event-id').value;
        const title = document.getElementById('event-title').value.trim();
        const date = document.getElementById('event-date').value;
        const time = document.getElementById('event-time').value;
        const category = document.getElementById('event-category').value;
        const description = document.getElementById('event-description').value.trim();

        if (!title || !date || !time) return;

        if (id) {
          // Update existing
          const idx = STATE.events.findIndex(e => e.id === id);
          if (idx !== -1) {
            STATE.events[idx] = { id, title, date, time, category, description, color: STATE.selectedColor };
          }
        } else {
          // Add new
          const newEv = {
            id: Date.now().toString(),
            title, date, time, category, description,
            color: STATE.selectedColor
          };
          STATE.events.push(newEv);
        }

        saveEvents();
        render();
        closeModal();
      };

      // Delete Event
      document.getElementById('btn-delete-event').onclick = () => {
        const id = document.getElementById('event-id').value;
        if (id) {
          STATE.events = STATE.events.filter(e => e.id !== id);
          saveEvents();
          render();
          closeModal();
        }
      };

      // Navigation Prev/Next/Today
      document.getElementById('btn-today').onclick = () => {
        STATE.currentDate = new Date();
        render();
      };

      document.getElementById('btn-prev').onclick = () => {
        if (STATE.view === 'month') {
          STATE.currentDate.setMonth(STATE.currentDate.getMonth() - 1);
        } else if (STATE.view === 'week') {
          STATE.currentDate.setDate(STATE.currentDate.getDate() - 7);
        } else if (STATE.view === 'day') {
          STATE.currentDate.setDate(STATE.currentDate.getDate() - 1);
        }
        render();
      };

      document.getElementById('btn-next').onclick = () => {
        if (STATE.view === 'month') {
          STATE.currentDate.setMonth(STATE.currentDate.getMonth() + 1);
        } else if (STATE.view === 'week') {
          STATE.currentDate.setDate(STATE.currentDate.getDate() + 7);
        } else if (STATE.view === 'day') {
          STATE.currentDate.setDate(STATE.currentDate.getDate() + 1);
        }
        render();
      };

      // View Buttons
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.onclick = (e) => {
          document.querySelectorAll('.view-btn').forEach(b => {
            b.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-xs', 'text-brand-600', 'dark:text-brand-400');
          });
          e.target.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-xs', 'text-brand-600', 'dark:text-brand-400');

          STATE.view = e.target.dataset.view;
          document.querySelectorAll('.calendar-view').forEach(v => v.classList.add('hidden'));
          document.getElementById(`view-${STATE.view}`).classList.remove('hidden');

          render();
        };
      });

      // Default Active View Style
      document.querySelector('[data-view="month"]').classList.add('bg-white', 'dark:bg-slate-700', 'shadow-xs', 'text-brand-600', 'dark:text-brand-400');

      // Search Handler
      document.getElementById('search-input').oninput = (e) => {
        STATE.searchQuery = e.target.value;
        render();
      };
    }

    // --- UTILITY FUNCTIONS ---
    function formatDate(d) {
      const year = d.getFullYear();
      const month = (d.getMonth() + 1).toString().padStart(2, '0');
      const day = d.getDate().toString().padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getStartOfWeek(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day;
      return new Date(date.setDate(diff));
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
